appId: io.github.nhilaire.miniworlds
name: Language - switch from the settings, the whole UI follows at once and the choice survives a restart
tags:
  - language
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 30000
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-settings"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "profile-settings"
- tapOn:
    id: "settings-language-fr"
- assertVisible: "Paramètres"
- takeScreenshot: language-fr-settings
- tapOn:
    id: "settings-language-en"
- assertVisible: "Settings"
- assertVisible: "Sound"
- takeScreenshot: language-en-settings
- tapOn:
    id: "settings-back"
- tapOn:
    id: "tab-home"
- assertVisible: "Play"
- takeScreenshot: language-en-home
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible: "Play"
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-settings"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "profile-settings"
- tapOn:
    id: "settings-language-auto"
- tapOn:
    id: "settings-language-fr"
- tapOn:
    id: "settings-back"
- tapOn:
    id: "tab-home"
- assertVisible: "Jouer"
