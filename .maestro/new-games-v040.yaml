appId: io.github.nhilaire.miniworlds
name: v0.4.0 smoke - each of the twelve v0.4.0 games opens from its world through the test link (one capture each), Pause and Quitter reach the Result (AC-109)
tags:
  - newgames040
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 30000
- tapOn:
    id: "consent-refuse"
- runFlow: helpers/french.yaml
# The test link opens every world and every game for the session (nothing is written to the save).
- openLink: miniworlds://seed/5/unlocked
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- tapOn:
    id: "tab-games"
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: arcade
      GAME: dash
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: puzzle
      GAME: tiles
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: strategy
      GAME: conquest
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: strategy
      GAME: defense
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: cards
      GAME: hands
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: cards
      GAME: patience
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: skill
      GAME: darts
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: skill
      GAME: shot
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: memory
      GAME: pattern
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: memory
      GAME: chain
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: challenges
      GAME: laser
- runFlow:
    file: helpers/new-game.yaml
    env:
      WORLD: challenges
      GAME: twins
