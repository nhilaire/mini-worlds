appId: io.github.nhilaire.miniworlds
name: Telemetry - accept consent, play one round, collect the daily reward, buy nothing (events checked in logcat by verify.mjs)
tags:
  - telemetry
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 30000
- tapOn:
    id: "consent-accept"
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "home-daily"
- tapOn:
    id: "daily-collect"
- tapOn:
    id: "daily-back"
- tapOn:
    id: "home-play"
- extendedWaitUntil:
    visible:
      id: "blocks-screen"
    timeout: 15000
- swipe:
    from:
      id: "blocks-board"
    direction: RIGHT
    duration: 300
- tapOn:
    id: "blocks-board"
- swipe:
    from:
      id: "blocks-board"
    direction: DOWN
    duration: 300
- repeat:
    times: 14
    commands:
      - tapOn:
          id: "blocks-board"
- tapOn:
    id: "game-pause"
- tapOn:
    id: "pause-quit"
- extendedWaitUntil:
    visible:
      id: "result-screen"
    timeout: 10000
- takeScreenshot: telemetry-result
